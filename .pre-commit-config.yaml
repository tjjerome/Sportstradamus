# Pre-commit hooks for Sportstradamus.
# See docs/STYLE_GUIDE.md §14 for rationale.
#
# Setup: `poetry install && poetry run pre-commit install`
# Run on the whole tree: `poetry run pre-commit run --all-files`

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8    # keep == pyproject ruff pin
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        # Advisory only — see pyproject.toml [tool.mypy].
        files: ^src/sportstradamus/
        additional_dependencies: []
        # Skip on commit so slow type checks don't block local iteration;
        # CI runs the same check and surfaces warnings there.
        stages: [manual]

  - repo: local
    hooks:
      # Style §5 / §11: block the defensive try-blocks that were audited out —
      # bare `except:` and optional-dependency imports (`except ImportError`).
      # Blind `except Exception:` swallows are left to review: most catches in
      # this repo log-and-continue around flaky external I/O, so BLE over-reaches.
      - id: no-defensive-except
        name: no bare/optional-import except (STYLE_GUIDE §5/§11)
        entry: python scripts/check_defensive_except.py
        language: system
        types: [python]
        exclude: '^src/deprecated/'

      # Smoke test: confer/meditate/prophecize wired through fixtures + stubs.
      # Forced into fake-API mode so the hook never hits the network. Live-API
      # mode (`SPORTSTRADAMUS_INTEGRATION_REAL_APIS=1`) is opt-in for manual
      # runs only.
      - id: integration-smoke
        name: integration smoke (no APIs)
        entry: env -u SPORTSTRADAMUS_INTEGRATION_REAL_APIS poetry run pytest tests/integration/ -m integration -q
        language: system
        pass_filenames: false
        stages: [pre-commit]
