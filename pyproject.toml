[tool.poetry]
name = "Sportstradamus"
version = "4.2.0"
description = "Scrape Sportsbooks Odds and Player Stats and export to Google Sheets"
authors = ["Trevor Jerome <trevor81994@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/tjjerome/sportstradamus"
repository = "https://github.com/tjjerome/sportstradamus"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
google-auth-oauthlib = ">=1.0.0"
gspread = ">=5.8.0"
mlb-statsapi = ">=1.6.1"
nba-api = ">=1.11.4"
nfl-data-py = ">=0.3.2"
numpy = ">=1.24.3,<2.0.0"
pandas = ">=2.0.1"
protobuf = ">=4.23.0"
requests = ">=2.30.0"
# Security floors for requests' transitive deps; pinned directly because
# poetry.lock is gitignored, so nothing else holds the patched versions
# (Dependabot GHSA-qccp-gfcp-xxvc, GHSA-mf9v-mfxr-j63j, GHSA-65pc-fj4g-8rjx).
urllib3 = ">=2.7.0"
idna = ">=3.15"
scipy = ">=1.10.1"
tqdm = ">=4.65.0"
importlib = "^1.0.4"
click = "^8.1.3"
pytz = "^2023.3"
scikit-learn = ">=1.5.0,<1.8.0"
shap = "==0.45.1"
lightgbmlss = ">=0.6"
torch = {version = "2.1.2", source = "pytorch_cpu"}
line-profiler = "^4.1.3"
klepto = "^0.2.5"
h5py = ">=3.9"
duckdb = "^1.1.0"
nflreadpy = "^0.1.2"
polars = "^1.33.1"
pyarrow = "^21.0.0"
scrapeops-python-requests = "^0.4.7"
streamlit = ">=1.38"
plotly = ">=5.18"
streamlit-aggrid = "^1.2.1.post2"

[tool.poetry.scripts]
prophecize = "sportstradamus.prediction.cli:main"
confer = "sportstradamus.moneylines:confer"
meditate = "sportstradamus.training.cli:meditate"
dashboard = "sportstradamus.dashboard:run"
reflect = "sportstradamus.nightly:run"
kelly = "sportstradamus.strategies.kelly:main"
pickem-build = "sportstradamus.strategies.underdog_pickem:main"
backfill-live-metrics = "sportstradamus.scripts.backfill_live_metrics:main"
check-graduation = "sportstradamus.scripts.check_graduation:main"
generate-ship-config = "sportstradamus.scripts.generate_ship_config:main"
merge-archives = "sportstradamus.scripts.merge_archives:main"
fp-fetch = "sportstradamus.fantasypoints.cli:fp_fetch"

[tool.poetry.group.strategy]
optional = true

[tool.poetry.group.strategy.dependencies]
# cvxpy + SCS power joint_kelly_portfolio; PyYAML and tabulate drive the
# `kelly` CLI's recommendations-YAML I/O. All three are lazy-imported so
# core users do not have to install them.
cvxpy = ">=1.4"
pyyaml = ">=6.0"
tabulate = ">=0.9"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.23.1"
sphinx-pdj-theme = "^0.4.0"
sphinx-pyproject = "^0.1.0"
lightgbm = ">=4.2.0,<4.3.0"
pytest = "^9.0.3"
matplotlib = "^3.7.1"
optuna = ">=3.5.0,<3.6.0"
optuna-dashboard = "^0.10.2"
seaborn = "^0.13.1"
ruff = "^0.15.0"
mypy = "^1.10.0"
pre-commit = "^3.7.0"
pylint = "^3.2"          # duplicate-code detector only; see [tool.pylint.*]


[[tool.poetry.source]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"


[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# -----------------------------------------------------------------------------
# Code quality tooling. See docs/STYLE_GUIDE.md for the conventions these
# configurations enforce.
# -----------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
# Archived code stays readable but is not held to the live style.
extend-exclude = ["src/deprecated"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear,
# D: pydocstyle, SIM: simplify, RUF: ruff-native, N: naming,
# PTH: pathlib, PLR/PLW: pylint refactor/warning, PERF: performance,
# TID: tidy-imports.
# C4/RET/PIE/ERA/FBT/T20 mechanize STYLE_GUIDE rules that were docs-only.
# C90 (mccabe) is deliberately omitted: the .claude/hooks/complexity-gate.py
# AST gate covers complexity diff-scoped, without flagging all legacy code.
select = [
    "E", "W", "F", "I", "UP", "B", "D", "SIM", "RUF",
    "N", "PTH", "PLR", "PLW", "PERF", "TID",
    "C4",   # flake8-comprehensions — §10 idioms (mostly autofixable)
    "RET",  # flake8-return — §10 guard clauses; RET504 = "name steps, not echoes"
    "PIE",  # flake8-pie — misc redundancy (mostly autofixable)
    "ERA",  # eradicate — §12 no commented-out code (dormant; see ignore ratchet)
    "FBT",  # flake8-boolean-trap — §10 no flag arguments (dormant; see ignore)
    "T20",  # flake8-print — §9 no stray prints (dormant; see ignore)
]
ignore = [
    # PRIORITY LIFT — these contradict CLAUDE.md hard rules and head the
    # ratchet queue: E722 (bare except -> STYLE_GUIDE §11) and PLR2004
    # (magic values -> §9 / no-magic-numbers). Both still appear in the phase
    # blocks below; clear those modules first, then drop them from here.

    # ----- Anti-slop ratchet: declared in `select`, dormant until a one-time
    # burn-down. Baseline with `ruff check --add-noqa src/sportstradamus/`,
    # then drop each code as its modules are cleaned.
    "ERA001",                       # §12 commented-out code
    "FBT001", "FBT002", "FBT003",   # §10 boolean flag arguments
    "T201", "T203",                 # §9 stray print / pprint

    # Module and package docstrings — ratcheting up as each file gains one.
    "D100", "D104",
    # Argument and statement-count limits — advisory during the refactor.
    "PLR0913", "PLR0915",
    # Long-line rule — the formatter already handles wrapping.
    "E501",

    # ----- Refactor ratchet: lifted as each phase fixes the underlying issue.
    # Phase 3 (helpers/moneylines) removes:
    #   D101 D102 D103 D107 D205 D414 D415 D417 — docstring coverage
    "D101", "D102", "D103", "D107", "D205", "D414", "D415", "D417",
    # Phase 3-5 (renaming variables, splitting big functions) removes:
    #   N803 N806 N816 — non-conforming names inside the refactored modules
    #   PLR0911 PLR0912 — branch/return counts
    #   PLR2004 — magic-value comparisons (replaced by named constants)
    #   PLW0602 PLW0603 — global-statement usage in train.py / sportstradamus.py
    "N803", "N806", "N816",
    "PLR0911", "PLR0912", "PLR2004",
    "PLW0602", "PLW0603",
    # Phase 3 (helpers/scraping + helpers/config) removes:
    #   PTH100 PTH110 PTH113 PTH118 PTH120 PTH123 — pathlib migration
    "PTH100", "PTH110", "PTH113", "PTH118", "PTH120", "PTH123",
    # Phase 4-5 (deep refactors) removes:
    #   B007 B008 B023 — bugbear false positives in numeric code
    #   E402 — late imports inside script-style modules
    #   E714 E721 E722 E741 — older idioms inside stats/train
    #   F401 F403 F405 F811 — wildcard re-exports across packages
    #   F821 — undefined names (limited to deprecated/unused_funcs.py; archived in Phase 2)
    #   PERF401 PERF403 — performance suggestions
    #   PLW0127 PLW2901 — assignment patterns
    #   PLR1704 — argument shadowing
    #   RUF001 RUF002 RUF003 RUF012 — Unicode characters and class defaults
    #   SIM102 — collapsible-if
    #   UP015 — redundant open modes
    #   W291 W293 — whitespace inside docstrings
    "B007", "B008", "B023",
    "E402", "E714", "E721", "E722", "E741",
    "F401", "F403", "F405", "F811", "F821",
    "PERF401", "PERF403",
    "PLW0127", "PLW2901", "PLR1704",
    "RUF001", "RUF002", "RUF003", "RUF012",
    "SIM102",
    "UP015",
    "W291", "W293",
    # Phase 2 (rename modules) removes:
    #   N812 N999 — module/import casing
    "N812", "N999",
]

[tool.ruff.lint.per-file-ignores]
# Scripts are terser by nature; tests do not need docstrings. Scripts may
# legitimately print, so keep T20 off them even after the ratchet lifts it.
"src/sportstradamus/scripts/*" = ["D", "PLR", "T201", "T203"]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["sportstradamus"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
files = ["src/sportstradamus"]
# Advisory: run alongside ruff but do not gate merges.
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true
# Strict on what is annotated; permissive on what is not.
disallow_untyped_defs = false
check_untyped_defs = true

# -----------------------------------------------------------------------------
# Duplication detector. Ruff has no clone detection; pylint's similarity
# checker fills that gap (GitClear's data makes duplication the dominant
# AI-debt signal). Advisory like mypy — NOT part of the blocking `ruff check`
# gate. Run on demand / in CI with everything except the clone checker off:
#
#     poetry run pylint --disable=all --enable=duplicate-code src/sportstradamus/
#
# Review the report and hoist genuine clones into the base class or a shared
# helper (STYLE_GUIDE §2.9; rule of three §2.6). Accept intentional per-league
# parallelism in stats/ rather than over-abstracting it — raise
# min-similarity-lines if that directory is too noisy.
# -----------------------------------------------------------------------------
[tool.pylint.similarities]
min-similarity-lines = 6
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end pipeline test (confer -> meditate -> prophecize) on cached fixtures. Skipped by default; opt in with `pytest -m integration`.",
]
# Default runs skip the integration suite. CI's `pytest tests/golden/` is
# unaffected because golden tests are unmarked.
addopts = "-m 'not integration'"